version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: --Docker/Dockerfile
    container_name: clinic_web
    ports:
      - "8080:80"
    volumes:
      - ..:/var/www/html
      - vendor_data:/var/www/html/vendor
      - ../app/storage:/var/www/html/app/storage
      - ../public/uploads:/var/www/html/public/uploads
    environment:
      - DB_HOST=217.76.57.212
      - DB_NAME=hclinic_roaya
      - DB_USER=clinic_roaya
      - DB_PASS=Carmen@1230
      - DRUGS_DB_HOST=217.76.57.212
      - DRUGS_DB_NAME=hclinic_drugs
      - DRUGS_DB_USER=clinic_roaya
      - DRUGS_DB_PASS=Carmen@1230
      - APP_ENV=local
      - APP_DEBUG=true
    networks:
      - clinic_network

  db:
    image: mysql:8.0
    container_name: clinic_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: roaya
      MYSQL_USER: roaya_user
      MYSQL_PASSWORD: roaya_password
    volumes:
      - db_data:/var/lib/mysql
      - ./app/seed/01-create-drugs-db.sql:/docker-entrypoint-initdb.d/00-create-drugs-db.sql:ro
      - ./app/seed/02-import-drugs-wrapper.sql:/docker-entrypoint-initdb.d/01-use-drugs-db.sql:ro
      - ./app/seed/hclinic_roaya.sql:/docker-entrypoint-initdb.d/02-import.sql:ro
      - ./app/seed/hclinic_drugs.sql:/docker-entrypoint-initdb.d/03-import-drugs.sql:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - clinic_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: clinic_phpmyadmin
    ports:
      - "8082:80"
    environment:
      PMA_HOST: 217.76.57.212
      PMA_USER: clinic_roaya
      PMA_PASSWORD: Carmen@1230
      UPLOAD_LIMIT: 300M
    networks:
      - clinic_network

volumes:
  db_data:
  vendor_data:

networks:
  clinic_network:
    driver: bridge
