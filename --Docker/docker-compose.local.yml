services:
  web:
    build:
      context: ..
      dockerfile: --Docker/Dockerfile
    container_name: clinic_web
    ports:
      - "8080:80"
    volumes:
      - ..:/var/www/html
      - vendor_data:/var/www/html/vendor
      - ../app/storage:/var/www/html/app/storage
      - ../public/uploads:/var/www/html/public/uploads
      - ../uploads:/var/www/html/uploads
      - ./sync/setup-symlinks.sh:/docker-entrypoint-init.d/setup-symlinks.sh:ro
    command: >
      bash -c "
        /docker-entrypoint-init.d/setup-symlinks.sh &&
        apache2-foreground
      "
    environment:
      # Local database (fast)
      - DB_HOST=db
      - DB_NAME=hclinic_roaya
      - DB_USER=clinic_user
      - DB_PASS=clinic_password
      - DRUGS_DB_HOST=db
      - DRUGS_DB_NAME=hclinic_drugs
      - DRUGS_DB_USER=clinic_user
      - DRUGS_DB_PASS=clinic_password
      # Remote database credentials (for sync)
      - REMOTE_DB_HOST=217.76.57.212
      - REMOTE_DB_NAME=hclinic_roaya
      - REMOTE_DB_USER=clinic_roaya
      - REMOTE_DB_PASS=Carmen@1230
      - REMOTE_DRUGS_DB_NAME=hclinic_drugs
      - APP_ENV=local
      - APP_DEBUG=true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - clinic_network

  db:
    image: mysql:8.0
    container_name: clinic_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: clinic_user
      MYSQL_PASSWORD: clinic_password
    volumes:
      - db_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - clinic_network

  # Sync service - runs periodically to sync with remote
  sync:
    image: mysql:8.0
    container_name: clinic_sync
    volumes:
      - ./sync:/scripts
      - sync_data:/sync_data
    environment:
      # Local DB
      - LOCAL_DB_HOST=db
      - LOCAL_DB_USER=clinic_user
      - LOCAL_DB_PASS=clinic_password
      - LOCAL_DB_NAME=hclinic_roaya
      - LOCAL_DRUGS_DB=hclinic_drugs
      # Remote DB
      - REMOTE_DB_HOST=217.76.57.212
      - REMOTE_DB_USER=clinic_roaya
      - REMOTE_DB_PASS=Carmen@1230
      - REMOTE_DB_NAME=hclinic_roaya
      - REMOTE_DRUGS_DB=hclinic_drugs
      # Sync interval in seconds (default: 5 minutes)
      - SYNC_INTERVAL=300
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/sync-loop.sh"]
    networks:
      - clinic_network

  # File sync service - syncs all uploads from remote server
  file-sync:
    image: alpine:latest
    container_name: clinic_file_sync
    volumes:
      - ./sync:/scripts
      - ../app/storage:/app/storage
      - ../public/uploads:/public/uploads
      - ../uploads:/uploads
    environment:
      - REMOTE_HOST=217.76.57.212
      - REMOTE_USER=root
      - REMOTE_PASS=Carmen1230@@
      - REMOTE_PATH=/home/hclinic/web/roaya.hclinic.clinic/public_html
      - FILE_SYNC_INTERVAL=600
    entrypoint: ["/bin/sh", "/scripts/file-sync-loop.sh"]
    networks:
      - clinic_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: clinic_phpmyadmin
    ports:
      - "8082:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root_password
      UPLOAD_LIMIT: 300M
    depends_on:
      - db
    networks:
      - clinic_network

volumes:
  db_data:
  vendor_data:
  sync_data:

networks:
  clinic_network:
    driver: bridge
